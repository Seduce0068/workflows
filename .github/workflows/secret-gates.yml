# 個人リポジトリ共通の再利用可能ワークフロー（シークレットスキャンゲート）。
#
# pre-commit の Betterleaks を最終ゲートとして CI でも全履歴を走査する。
# 呼び出し側からは次のように参照する:
#   uses: Seduce0068/workflows/.github/workflows/secret-gates.yml@v1
# 入力の一覧は README.md を参照。
name: Secret gates

on:
  workflow_call:
    inputs:
      betterleaks_version:
        description: "導入する Betterleaks のバージョン（v1.x タグ）"
        required: false
        type: string
        default: v1.10.1
      go_version:
        description: "go install に使う Go ツールチェーン"
        required: false
        type: string
        default: "1.26"
      runner:
        description: "実行するランナー"
        required: false
        type: string
        default: ubuntu-24.04
      timeout_minutes:
        description: "ジョブのタイムアウト（分）"
        required: false
        type: number
        default: 15

jobs:
  betterleaks:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    steps:
      - name: チェックアウト（全履歴）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Go ツールチェーン
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ inputs.go_version }}

      - name: Betterleaks の導入
        env:
          VERSION: ${{ inputs.betterleaks_version }}
        run: |
          set -euo pipefail
          go install "github.com/betterleaks/betterleaks@${VERSION}"
          "$(go env GOPATH)/bin/betterleaks" --version

      - name: 全履歴スキャン
        run: |
          set -euo pipefail
          bin="$(go env GOPATH)/bin/betterleaks"
          out="$("$bin" git . 2>&1)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'no leaks found' || {
            echo 'Betterleaks detected a credential in the repository history.' >&2
            exit 1
          }
